<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>研習後台｜公布欄、文字雲與回饋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#10141F; --ink:#F3F6FB; --ink-2:#C8D2E0; --ink-3:#9BA9BD; --ink-4:#8A97AB;
  --accent:#7CB7E8; --accent-2:#E0A458; --bad:#D96A5A;
  --line:rgba(203,213,229,.20); --card:rgba(255,255,255,.055);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:20px 32px;border-bottom:1px solid var(--line)}
header h1{font-size:24px;margin:0;font-weight:900;letter-spacing:.02em}
header .spacer{flex:1}
button{font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;
  border:0;border-radius:10px;padding:9px 18px;transition:filter .2s}
button:hover{filter:brightness(1.1)}
button:disabled{opacity:.5;cursor:default}
#login{background:var(--accent);color:var(--bg)}
#logout{background:transparent;color:var(--ink-3);border:1px solid var(--line)}
.danger{background:rgba(217,106,90,.16);color:#F0A99E;border:1px solid rgba(217,106,90,.5)}
.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.who{font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--ink-3)}
main{max-width:1040px;margin:0 auto;padding:32px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:24px;margin-bottom:24px}
.card h2{font-size:20px;margin:0 0 16px;font-weight:700}
.card .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.kpi{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:16px}
.kpi .n{font-family:"JetBrains Mono",monospace;font-size:40px;font-weight:700;color:var(--accent-2);line-height:1.1;word-break:break-all}
.kpi .n.sm{font-size:22px}
.kpi .l{font-size:13px;color:var(--ink-3);margin-top:6px}
.muted{color:var(--ink-3);font-size:14px}
.bars{margin-top:20px;display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(120px,240px) 1fr 56px;gap:12px;align-items:center}
.bar .bl{font-size:16px;color:var(--ink);text-align:right;word-break:break-all;line-height:1.4}
.bar .bt{background:rgba(255,255,255,.06);border-radius:20px;height:20px;overflow:hidden}
.bar .bf{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.bar .bv{font-family:"JetBrains Mono",monospace;font-size:15px;color:var(--ink-2);text-align:right}
.fb-list{margin-top:16px;display:flex;flex-direction:column;gap:12px}
.fb-item{border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:rgba(255,255,255,.03)}
.fb-item .txt{font-size:17px;color:var(--ink);line-height:1.7;white-space:pre-wrap;word-break:break-word}
.fb-item .ts{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--ink-4);margin-top:8px}
.card h3{font-size:16px;margin:24px 0 10px;color:var(--ink-2);font-weight:700}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .full{grid-column:1/-1}
.form textarea,.form input{font-family:inherit;font-size:15px;color:var(--ink);
  background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.form textarea{min-height:84px;resize:vertical;line-height:1.6}
.form textarea:focus,.form input:focus{outline:none;border-color:var(--accent)}
.primary{background:var(--accent);color:var(--bg)}
.mg-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.mg-item{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;
  padding:10px 14px;background:rgba(255,255,255,.03)}
.mg-item .body{flex:1;min-width:0}
.mg-item .t{font-size:15px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.mg-item .u{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--ink-4);word-break:break-all;margin-top:2px}
.mg-item button{padding:6px 12px;font-size:13px}
#gate{max-width:520px;margin:80px auto;text-align:center}
#gate p{color:var(--ink-2);line-height:1.7}
.err{color:#F0A99E;font-size:14px;margin-top:10px}
@media (max-width:720px){
  .kpis{grid-template-columns:1fr}
  .bar{grid-template-columns:1fr 1fr 44px}
  .bar .bl{text-align:left}
  .form{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
  <h1>研習後台</h1>
  <span class="muted">公布欄 ＋ 文字雲統計 ＋ 學員回饋</span>
  <span class="spacer"></span>
  <span class="who" id="who"></span>
  <button id="login">用 Google 登入</button>
  <button id="logout" hidden class="ghost">登出</button>
</header>

<div id="gate">
  <p>這是講者專用的後台。請用 <b>fuwen@ppsh.ptc.edu.tw</b> 的 Google 帳號登入，才能檢視學員反應與回饋。</p>
  <p class="err" id="gateErr"></p>
</div>

<main id="panel" hidden>
  <section class="card">
    <h2>課堂公布欄 <a class="muted" href="board.html" target="_blank" rel="noopener" style="font-weight:400;margin-left:8px">開啟學員看到的頁面 →</a></h2>

    <h3>發布公告</h3>
    <form class="form" id="noticeForm" autocomplete="off">
      <textarea class="full" id="noticeText" maxlength="500" placeholder="公告內容（必填，500 字內）" required></textarea>
      <input id="noticeLabel" maxlength="30" placeholder="按鈕文字（選填，例如：下載範例檔）">
      <input id="noticeUrl" type="url" placeholder="連結網址（選填，https:// 開頭）">
      <div class="row full"><button type="submit" class="primary" id="noticeSubmit">發布</button>
        <button type="button" class="ghost" id="noticeCancel" hidden>取消修改</button><span class="muted" id="noticeMsg"></span></div>
    </form>
    <div class="mg-list" id="noticeList"></div>

    <h3>課堂連結</h3>
    <form class="form" id="linkForm" autocomplete="off">
      <input id="linkLabel" maxlength="40" placeholder="名稱（例如：作文範例資料夾）" required>
      <input id="linkUrl" type="url" placeholder="網址（https:// 開頭）" required>
      <div class="row full"><button type="submit" class="primary" id="linkSubmit">新增連結</button>
        <button type="button" class="ghost" id="linkCancel" hidden>取消修改</button><span class="muted" id="linkMsg"></span></div>
    </form>
    <div class="mg-list" id="linkList"></div>
  </section>

  <section class="card">
    <h2>文字雲統計</h2>
    <div class="kpis">
      <div class="kpi"><div class="n" id="cloudTotal">0</div><div class="l">總送出數（含重複）</div></div>
      <div class="kpi"><div class="n" id="cloudUnique">0</div><div class="l">不重複答案數</div></div>
      <div class="kpi"><div class="n sm" id="cloudTop">—</div><div class="l">最高票答案</div></div>
    </div>
    <div class="row" style="margin-top:20px">
      <button id="exportCloud" class="ghost">匯出統計 CSV</button>
      <button id="clearCloud" class="danger">清空文字雲</button>
      <span class="muted" id="cloudMsg"></span>
    </div>
    <div class="bars" id="cloudBars"></div>
  </section>

  <section class="card">
    <h2>學員回饋</h2>
    <div class="row">
      <div class="kpi" style="min-width:120px"><div class="n" id="fbCount">0</div><div class="l">則回饋</div></div>
      <span style="flex:1"></span>
      <button id="exportCsv" class="ghost">匯出回饋 CSV</button>
    </div>
    <div class="fb-list" id="fbList"></div>
  </section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getFirestore, collection, onSnapshot, getDocs, deleteDoc, doc, query, orderBy,
  addDoc, updateDoc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA4dqhuXY0nCSt3IvnogQOfkR9SVBUYHxc",
  authDomain: "basic-learning-2384f.firebaseapp.com",
  projectId: "basic-learning-2384f",
  storageBucket: "basic-learning-2384f.firebasestorage.app",
  messagingSenderId: "878087809392",
  appId: "1:878087809392:web:7815af97fecd57aa7147b5"
};

const OWNER = "fuwen@ppsh.ptc.edu.tw";
const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

const $ = (id) => document.getElementById(id);
const loginBtn=$("login"), logoutBtn=$("logout"), who=$("who");
const gate=$("gate"), gateErr=$("gateErr"), panel=$("panel");

let unsubCloud=null, unsubFb=null, unsubNotice=null, unsubLink=null;
let noticeCache=new Map(); // id → 公告資料，給「編輯」帶回表單用
let editingId=null;        // 正在修改的公告 id；null 代表發布新公告
let linkCache=new Map();   // id → 連結資料
let editingLinkId=null;    // 正在修改的連結 id；null 代表新增連結
let cloudCounts=[];   // [{w, c}]
let cloudTotalNum=0;
let feedbackCache=[]; // [{text, date}]

loginBtn.addEventListener("click", async () => {
  gateErr.textContent = "";
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch (e) { gateErr.textContent = "登入失敗：" + e.message; }
});
logoutBtn.addEventListener("click", () => signOut(auth));

onAuthStateChanged(auth, (user) => {
  if (unsubCloud) { unsubCloud(); unsubCloud=null; }
  if (unsubFb)    { unsubFb();    unsubFb=null; }
  if (unsubNotice){ unsubNotice(); unsubNotice=null; }
  if (unsubLink)  { unsubLink();  unsubLink=null; }

  if (user && user.email === OWNER) {
    who.textContent = user.email;
    loginBtn.hidden = true; logoutBtn.hidden = false;
    gate.hidden = true; panel.hidden = false;
    subscribe();
  } else {
    who.textContent = "";
    loginBtn.hidden = false; logoutBtn.hidden = true;
    gate.hidden = false; panel.hidden = true;
    if (user) gateErr.textContent = "此帳號（" + user.email + "）沒有後台權限。";
  }
});

function subscribe() {
  // 公布欄：公告（新的在上）與課堂連結（依新增順序）
  unsubNotice = onSnapshot(query(collection(db, "workshop_notices"), orderBy("created_at", "desc")), (s) => {
    noticeCache = new Map(s.docs.map((d) => [d.id, d.data() || {}]));
    $("noticeList").innerHTML = s.empty ? `<div class="muted">目前沒有公告。</div>`
      : s.docs.map((d) => {
          const n = d.data() || {};
          const u = n.link_url ? `<div class="u">${escapeHtml(n.link_label || "開啟連結")}：${escapeHtml(n.link_url)}</div>` : "";
          return `<div class="mg-item"><div class="body"><div class="t">${escapeHtml(n.text || "")}</div>${u}</div>
            <button class="ghost" data-edit="${d.id}">編輯</button>
            <button class="danger" data-col="workshop_notices" data-id="${d.id}">刪除</button></div>`;
        }).join("");
  }, (e) => { $("noticeMsg").textContent = "讀取失敗：" + e.message; });

  unsubLink = onSnapshot(query(collection(db, "workshop_links"), orderBy("created_at", "asc")), (s) => {
    linkCache = new Map(s.docs.map((d) => [d.id, d.data() || {}]));
    $("linkList").innerHTML = s.empty ? `<div class="muted">目前沒有連結。</div>`
      : s.docs.map((d) => {
          const l = d.data() || {};
          return `<div class="mg-item"><div class="body"><div class="t">${escapeHtml(l.label || "")}</div>
            <div class="u">${escapeHtml(l.url || "")}</div></div>
            <button class="ghost" data-edit-link="${d.id}">編輯</button>
            <button class="danger" data-col="workshop_links" data-id="${d.id}">刪除</button></div>`;
        }).join("");
  }, (e) => { $("linkMsg").textContent = "讀取失敗：" + e.message; });

  unsubCloud = onSnapshot(collection(db, "wordcloud_words"), (s) => {
    const map = new Map();
    s.forEach((d) => {
      const t = String((d.data() || {}).text || "").trim();
      if (!t) return;
      map.set(t, (map.get(t) || 0) + 1);
    });
    cloudTotalNum = s.size;
    cloudCounts = [...map].map(([w, c]) => ({ w, c })).sort((a, b) => b.c - a.c);
    renderCloud();
  }, (e) => { $("cloudMsg").textContent = "讀取失敗：" + e.message; });

  unsubFb = onSnapshot(query(collection(db, "workshop_feedback"), orderBy("created_at", "desc")), (s) => {
    feedbackCache = s.docs.map((d) => {
      const data = d.data() || {};
      const ts = data.created_at;
      return { text: data.text || "", date: ts && ts.toDate ? ts.toDate() : null };
    });
    renderFeedback();
  }, (e) => { $("fbList").innerHTML = `<div class="err">讀取失敗：${escapeHtml(e.message)}</div>`; });
}

function renderCloud() {
  $("cloudTotal").textContent = cloudTotalNum;
  $("cloudUnique").textContent = cloudCounts.length;
  $("cloudTop").textContent = cloudCounts.length ? cloudCounts[0].w : "—";

  const max = cloudCounts.length ? cloudCounts[0].c : 1;
  $("cloudBars").innerHTML = cloudCounts.map((o) => {
    const pct = Math.round((o.c / max) * 100);
    return `<div class="bar">
      <span class="bl">${escapeHtml(o.w)}</span>
      <span class="bt"><span class="bf" style="width:${pct}%"></span></span>
      <span class="bv">${o.c}</span>
    </div>`;
  }).join("");
}

function renderFeedback() {
  $("fbCount").textContent = feedbackCache.length;
  $("fbList").innerHTML = feedbackCache.length
    ? feedbackCache.map((f) => {
        const time = f.date ? f.date.toLocaleString("zh-TW", { hour12:false }) : "";
        return `<div class="fb-item"><div class="txt">${escapeHtml(f.text)}</div><div class="ts">${time}</div></div>`;
      }).join("")
    : `<div class="muted">目前還沒有回饋。</div>`;
}

$("noticeForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = $("noticeText").value.trim();
  const url = $("noticeUrl").value.trim();
  if (!text) return;
  if (url && !/^https?:\/\//i.test(url)) { $("noticeMsg").textContent = "網址要用 http:// 或 https:// 開頭。"; return; }
  const data = { text, link_label: $("noticeLabel").value.trim(), link_url: url };
  try {
    if (editingId) {
      // 修改：保留原發布時間（排序不變），另記修改時間
      await updateDoc(doc(db, "workshop_notices", editingId), { ...data, updated_at: serverTimestamp() });
      endEdit();
      $("noticeMsg").textContent = "已儲存修改。";
    } else {
      await addDoc(collection(db, "workshop_notices"), { ...data, created_at: serverTimestamp() });
      $("noticeForm").reset();
      $("noticeMsg").textContent = "已發布。";
    }
  } catch (err) { $("noticeMsg").textContent = (editingId ? "修改" : "發布") + "失敗：" + err.message; }
});

function startEdit(id) {
  const n = noticeCache.get(id);
  if (!n) return;
  editingId = id;
  $("noticeText").value = n.text || "";
  $("noticeLabel").value = n.link_label || "";
  $("noticeUrl").value = n.link_url || "";
  $("noticeSubmit").textContent = "儲存修改";
  $("noticeCancel").hidden = false;
  $("noticeMsg").textContent = "正在修改公告…";
  $("noticeForm").scrollIntoView({ behavior: "smooth", block: "center" });
  $("noticeText").focus();
}

function endEdit() {
  editingId = null;
  $("noticeForm").reset();
  $("noticeSubmit").textContent = "發布";
  $("noticeCancel").hidden = true;
  $("noticeMsg").textContent = "";
}

$("noticeCancel").addEventListener("click", endEdit);

$("linkForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const label = $("linkLabel").value.trim();
  const url = $("linkUrl").value.trim();
  if (!label || !/^https?:\/\//i.test(url)) { $("linkMsg").textContent = "請填名稱，網址要用 http:// 或 https:// 開頭。"; return; }
  try {
    if (editingLinkId) {
      // 修改：保留原新增時間（排序不變）
      await updateDoc(doc(db, "workshop_links", editingLinkId), { label, url, updated_at: serverTimestamp() });
      endEditLink();
      $("linkMsg").textContent = "已儲存修改。";
    } else {
      await addDoc(collection(db, "workshop_links"), { label, url, created_at: serverTimestamp() });
      $("linkForm").reset();
      $("linkMsg").textContent = "已新增。";
    }
  } catch (err) { $("linkMsg").textContent = (editingLinkId ? "修改" : "新增") + "失敗：" + err.message; }
});

function startEditLink(id) {
  const l = linkCache.get(id);
  if (!l) return;
  editingLinkId = id;
  $("linkLabel").value = l.label || "";
  $("linkUrl").value = l.url || "";
  $("linkSubmit").textContent = "儲存修改";
  $("linkCancel").hidden = false;
  $("linkMsg").textContent = "正在修改連結…";
  $("linkForm").scrollIntoView({ behavior: "smooth", block: "center" });
  $("linkLabel").focus();
}

function endEditLink() {
  editingLinkId = null;
  $("linkForm").reset();
  $("linkSubmit").textContent = "新增連結";
  $("linkCancel").hidden = true;
  $("linkMsg").textContent = "";
}

$("linkCancel").addEventListener("click", endEditLink);

// 公告與連結的刪除鈕（清單會重繪，所以用事件委派）
$("panel").addEventListener("click", async (e) => {
  const edit = e.target.closest("button[data-edit]");
  if (edit) { startEdit(edit.dataset.edit); return; }
  const editLink = e.target.closest("button[data-edit-link]");
  if (editLink) { startEditLink(editLink.dataset.editLink); return; }
  const btn = e.target.closest("button[data-col]");
  if (!btn) return;
  if (!confirm("確定要刪除這一則嗎？")) return;
  btn.disabled = true;
  // 刪掉正在修改的那則，就跳出修改模式
  if (btn.dataset.id === editingId) endEdit();
  if (btn.dataset.id === editingLinkId) endEditLink();
  try { await deleteDoc(doc(db, btn.dataset.col, btn.dataset.id)); }
  catch (err) { alert("刪除失敗：" + err.message); btn.disabled = false; }
});

$("clearCloud").addEventListener("click", async () => {
  if (!confirm("確定要清空文字雲的所有答案嗎？此動作無法復原。")) return;
  const btn = $("clearCloud"); btn.disabled = true; btn.textContent = "清空中…";
  try {
    const snap = await getDocs(collection(db, "wordcloud_words"));
    await Promise.all(snap.docs.map((d) => deleteDoc(doc(db, "wordcloud_words", d.id))));
    $("cloudMsg").textContent = "已清空 " + snap.size + " 筆。";
  } catch (e) {
    $("cloudMsg").textContent = "清空失敗：" + e.message;
  } finally {
    btn.disabled = false; btn.textContent = "清空文字雲";
  }
});

$("exportCloud").addEventListener("click", () => {
  const rows = [["排名", "答案", "次數", "占比"]].concat(
    cloudCounts.map((o, i) => [
      i + 1, o.w, o.c,
      cloudTotalNum ? ((o.c / cloudTotalNum) * 100).toFixed(1) + "%" : ""
    ])
  );
  downloadCsv(rows, "文字雲統計.csv");
});

$("exportCsv").addEventListener("click", () => {
  const rows = [["時間", "回饋"]].concat(
    feedbackCache.map((f) => [
      f.date ? f.date.toLocaleString("zh-TW", { hour12:false }) : "",
      f.text
    ])
  );
  downloadCsv(rows, "研習回饋.csv");
});

function downloadCsv(rows, filename) {
  const csv = rows.map((r) => r.map((c) => '"' + String(c).replace(/"/g, '""') + '"').join(",")).join("\r\n");
  const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}
</script>
</body>
</html>
